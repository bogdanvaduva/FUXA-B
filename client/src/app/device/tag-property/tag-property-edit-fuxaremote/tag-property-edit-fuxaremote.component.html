<div>
    <h1 mat-dialog-title class="dialog-title" mat-dialog-draggable>{{'device.fuxaremote-browse-title' | translate}}</h1>
    <mat-icon (click)="onNoClick()" class="dialog-close-btn">clear</mat-icon>
    <div mat-dialog-content style="display: contents;">
        <div class="browse-info">
            <span *ngIf="loading">{{'device.fuxaremote-browse-loading' | translate}}</span>
            <span *ngIf="error" class="browse-error">{{'device.fuxaremote-browse-error' | translate}} {{error}}</span>
        </div>
        <div style="overflow: auto; margin: 0px 10px">
            <ngx-treetable #treetable [config]="config" (expand)="queryNext($event)"></ngx-treetable>
        </div>
    </div>
    <div mat-dialog-actions class="dialog-action">
        <button mat-raised-button (click)="onNoClick()">{{'dlg.cancel' | translate}}</button>
        <button mat-raised-button color="primary" (click)="onOkClick()">{{'dlg.ok' | translate}}</button>
    </div>
</div>
